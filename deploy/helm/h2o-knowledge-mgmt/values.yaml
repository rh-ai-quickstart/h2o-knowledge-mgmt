replicaCount: 1

image:
  repository: h2o-knowledge-mgmt-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources: {}

aws-compatible-storage:
  enabled: true
  fullnameOverride: h2o-knowledge-mgmt-storage
  s3:
    region: us-east-1
  auth:
    enabled: false
  route:
    enabled: false
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi
